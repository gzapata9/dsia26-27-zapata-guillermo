# Orquestador programado: genera la previsión diaria y la publica como artefacto.
# Usa NVIDIA si existe el secret NVIDIA_API_KEY; si no, el modo mock.
name: Proyecto II · Forecast diario

on:
  schedule:
    - cron: "17 10 * * *"   # 10:17 UTC ≈ 05:17 en Washington DC
  workflow_dispatch:

jobs:
  forecast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Proyecto_II
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Proyecto_II/requirements.txt
      - run: pip install -r requirements.txt
      - name: Forecast
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          PROVIDER=mock
          if [ -n "${NVIDIA_API_KEY}" ]; then PROVIDER=nvidia; fi
          python -m bikedemand --output-dir outputs forecast --provider "$PROVIDER"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecast-${{ github.run_id }}
          path: Proyecto_II/outputs/
